[project]
name = "ppai-assistant"
version = "0.1.0"
description = "Automotive AI Assistant demo with CrewAI, a web dashboard and Kyutai voice (TTS/STT)"
requires-python = ">=3.10,<3.15"
dependencies = [
    "aiohttp",
    "crewai",
    "crewai-core",
    "numpy-quaternion",
    "structlog",
    "omegaconf",
    "influxdb-client",
    "websockets",
    "paho-mqtt",
    "amqtt",
    "openai",
    "pandas",
    "pyarrow",
    "pymupdf>=1.24",
    "chromadb>=1.0,<2",
    # Voice: Kyutai TTS/STT (Delayed Streams Modeling, PyTorch backend)
    "moshi",
    "torch==2.9.1",
    "sphn",
    "sounddevice",
    "numpy",
    "laya>=0.3.5",
    "pytest",
    "kev; python_version >= '3.12' and python_version < '3.14'",
]

[project.optional-dependencies]
# Kernels accelerati di transformers per i layer GatedDeltaNet di Qwen3.5 (backend kev).
# Senza questa extra transformers usa il fallback PyTorch di riferimento: corretto ma più lento.
# flash-linear-attention è pinnata alla FLA_VERSION richiesta da agents/backends/kev/kev/fused_qwen35.py.
gpu = [
    "flash-linear-attention==0.5.2",
    "causal-conv1d>=1.5; python_version >= '3.12' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
kev = { path = "agents/backends/kev" }
moshi = { path = "voice/moshi" }

[tool.pytest.ini_options]
testpaths = ["tests"]
