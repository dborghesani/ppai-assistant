[project]
name = "ppai-assistant"
version = "0.1.0"
description = "Automotive AI Assistant demo with CrewAI, PySide6/QML and Kyutai voice (TTS/STT)"
requires-python = ">=3.10"
dependencies = [
    "PySide6",
    "crewai",
    "crewai-core",
    "qasync",
    "numpy-quaternion",
    "structlog",
    "omegaconf",
    "influxdb-client",
    "websockets",
    "paho-mqtt",
    "amqtt",
    "openai",
    # Voice: Kyutai TTS/STT (Delayed Streams Modeling, PyTorch backend)
    "moshi",
    "torch==2.9.1",
    "sphn",
    "sounddevice",
    "numpy",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
