[project]
name = "ppai-assistant"
version = "0.1.0"
description = "Automotive AI Assistant demo with CrewAI, PySide6/QML and Kyutai voice (TTS/STT)"
requires-python = ">=3.10"
dependencies = [
    "PySide6",
    "crewai",
    "crewai-core",
    "qasync",
    "structlog",
    "omegaconf",
    "influxdb-client",
    "websockets",
    "aiomqtt",
    "amqtt",
    # Voice: Kyutai TTS/STT (Delayed Streams Modeling, PyTorch backend)
    "moshi",
    "torch",
    "sphn",
    "sounddevice",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"